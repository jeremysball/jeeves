name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Single collapsed job rather than a [lint, typecheck, unit] matrix — see
    # scaffolding-repos: this account's shared Actions concurrent-runner cap
    # saturates once a few PRs are open across repos, leaving matrix legs
    # queued 10-20+ min for a runner slot. One job means one runner request
    # per push/PR; the tradeoff is legs running sequentially instead of in
    # parallel.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev

      # The real-boundary coverage tests (test_spec_coverage.py's needs_real_cli
      # set) run when auditing-worktrees' coverage-score is on disk, and FAIL in
      # CI when it is absent (see the needs_real_cli marker) -- never silently
      # skip, so contract drift cannot ship green. This step installs the
      # sibling at a pinned commit so the real CLI is exercised. The default
      # GITHUB_TOKEN cannot read a private sibling repo, so the step is
      # best-effort: if it cannot clone (no AUDIT_WORKTREES_PAT secret, or the
      # sibling is inaccessible), it logs a warning and the real-boundary tests
      # turn the run red -- the loud signal that the boundary is untested. To go
      # green, add an AUDIT_WORKTREES_PAT secret with repo read access.
      - name: Install auditing-worktrees for real-boundary tests
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AUDIT_WORKTREES_PAT || github.token }}
        run: |
          mkdir -p "$HOME/.claude/skills"
          git clone --quiet --filter=blob:none \
            https://github.com/jeremysball/auditing-worktrees.git \
            "$HOME/.claude/skills/auditing-worktrees"
          git -C "$HOME/.claude/skills/auditing-worktrees" \
            checkout --quiet ea0915cded8eb899c324765b2430964eb78f288c
          test -x "$HOME/.claude/skills/auditing-worktrees/bin/coverage-score" \
            || { echo "coverage-score missing from pinned sibling"; exit 1; }

      - name: Run lint
        run: uv run ruff check bin tests

      - name: Run type check
        run: uv run mypy bin

      - name: Run tests
        run: uv run pytest -q
