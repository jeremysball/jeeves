name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Single collapsed job rather than a [lint, typecheck, unit] matrix — see
    # scaffolding-repos: this account's shared Actions concurrent-runner cap
    # saturates once a few PRs are open across repos, leaving matrix legs
    # queued 10-20+ min for a runner slot. One job means one runner request
    # per push/PR; the tradeoff is legs running sequentially instead of in
    # parallel.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev

      # The real-boundary coverage tests (test_spec_coverage.py's needs_real_cli
      # set) run when auditing-worktrees' coverage-score is on disk, and FAIL in
      # CI when it is absent (see the needs_real_cli marker) -- never silently
      # skip, so contract drift cannot ship green. Fetch the sibling with
      # actions/checkout, which injects the GITHUB_TOKEN as a git credential the
      # way a bare `git clone` cannot (git over HTTPS does not read GH_TOKEN).
      # Same-owner private repos are readable this way; the token grants the
      # workflow access to them. Pinned to a known commit so the contract is a
      # deliberate, reviewable fact rather than "whatever main is today".
      - name: Fetch auditing-worktrees for real-boundary tests
        uses: actions/checkout@v4
        with:
          repository: jeremysball/auditing-worktrees
          ref: ea0915cded8eb899c324765b2430964eb78f288c
          path: .ci/auditing-worktrees
          # The default GITHUB_TOKEN cannot read a private sibling repo (confirmed:
          # a 404 even via checkout). A fine-grained PAT scoped to
          # jeremysball/auditing-worktrees with Contents: Read, stored as the
          # JEEVES_CI_PAT secret, grants it. Without the secret this step
          # fails and the real-boundary tests turn the run red -- the loud signal
          # that the boundary is untested.
          token: ${{ secrets.JEEVES_CI_PAT || github.token }}
      - name: Point coverage at the pinned sibling
        run: |
          test -x ".ci/auditing-worktrees/bin/coverage-score" \
            || { echo "coverage-score missing from pinned sibling"; exit 1; }
          echo "AUDIT_WORKTREES_BIN=$PWD/.ci/auditing-worktrees/bin" >> "$GITHUB_ENV"

      - name: Run lint
        run: uv run ruff check bin tests

      - name: Run type check
        run: uv run mypy bin

      - name: Run tests
        run: uv run pytest -q
