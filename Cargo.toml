[package]
name = "jeeves"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "5"
fs2 = "0.4.3"
iana-time-zone = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
unicode-case-mapping = "1.0.0"
unicode-normalization = "0.1.25"
